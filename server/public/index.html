<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
        <h1>Expense Tracker</h1>

        <div id=authSection>
            <h2>Login or Register</h2>
            <input type="email" id="email" placeholder="Email">
            <input type="password" id="password" placeholder="Password">
            <button id="loginBtn">Login</button>
            <button id="registerBtn">Register</button>
            <p id="authMessage"></p>
        </div>

        <div id="appSection" style="display: none;">
            <p><button id="logoutBtn">Logout</button></p>

            <input type="text" id="title" placeholder="Lunch">
            <input type="number" id="amount" placeholder="150">
            <select id="category">
                <option>Food</option>
                <option>Transport</option>
                <option>Bills</option>
            </select>
            <button id="addBtn">Add Expense</button>

            <h2 id="total">Total: PHP0</h2>

            <select id="currency">
                <option>USD</option>
                <option>EUR</option>
                <option>JPY</option>
            </select>
            <button id="convertBtn">Convert total</button>
            <p id="converted"></p>

            <div id="filters">
                <button data-category="All">All</button>
                <button data-category="Food">Food</button>
                <button data-category="Transport">Transport</button>
                <button data-category="Bills">Bills</button>
            </div>

            <ul id="list"></ul>
        </div>

    </div>  

    <script src="script.js"></script>
</body>
</html>
